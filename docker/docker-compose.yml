# M365-Codex 本地/自托管部署示例
#
# 使用方式：
#   1. 在仓库根目录复制 .env.example 为 .env 并填写必填项
#   2. docker compose -f docker/docker-compose.yml up -d
#
# 注意：.env 中包含主密钥与管理密码，切勿提交到任何仓库。

services:
  m365-codex:
    # 镜像发布在 Docker Hub。可用 M365_CODEX_IMAGE 覆盖具体版本，例如
    # M365_CODEX_IMAGE=foch0x97/m365-codex:0.4.1
    image: ${M365_CODEX_IMAGE:-foch0x97/m365-codex:latest}
    # 若要本地构建镜像，取消下面注释：
    # build:
    #   context: ..
    #   dockerfile: Dockerfile
    container_name: m365-codex
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: "8080"
      DATA_DIR: /data
    ports:
      - "8080:8080"
    volumes:
      - m365-codex-data:/data
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  m365-codex-data:
