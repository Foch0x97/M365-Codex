version: 2

# 依赖与 Action 的自动更新（对应实施计划 §20.3）。
#
# 三个 npm 生态各自独立：根 workspace（服务端 + 共享包）、管理界面、探针。
# 它们用各自的 lockfile，混在一起更新只会互相牵制。
#
# 合并策略：分组提 PR，避免一次十几个单独 PR 淹掉列表；安全更新不分组，
# 让它单独出来更显眼。
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      生产依赖:
        dependency-type: production
      开发依赖:
        dependency-type: development

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      管理界面依赖:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /probe
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      探针依赖:
        patterns: ['*']

  # Action 一律按 commit SHA 固定，Dependabot 会连注释里的版本号一起更新
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      工作流依赖:
        patterns: ['*']
