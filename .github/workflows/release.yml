name: 发布镜像

# 推送到 Docker Hub。镜像仓库与凭据来自仓库配置：
#   secrets.DOCKERHUB_USERNAME / secrets.DOCKERHUB_TOKEN
#   vars.DOCKERHUB_REPOSITORY（如 m365-codex）
# 镜像名为 <DOCKERHUB_USERNAME>/<DOCKERHUB_REPOSITORY>。
#
# 标签策略：
#   push 到 main   → main、sha-<短哈希>
#   打 v* 版本 tag → 完整版本号、主次版本号（如 v0.4.0 → 0.4.0、0.4）
#   正式 Release   → latest（仅此一种情况会移动 latest）
on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # cosign 无密钥签名要用 OIDC 令牌换取短期证书
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: 构建并推送多架构镜像到 Docker Hub
    runs-on: ubuntu-latest
    # 未配置 Docker Hub 仓库变量时跳过（例如 fork），避免无谓失败
    if: ${{ vars.DOCKERHUB_REPOSITORY != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: 登录 Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}
          # 关掉默认的 latest=auto，改由下面显式控制
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # latest 跟随任意 v* 版本 tag 或正式 Release
            type=raw,value=latest,enable=${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') }}

      - name: 安装 cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: 构建并推送
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # 无密钥签名：证书由 Sigstore 依据 GitHub OIDC 身份签发，不需要在仓库里存私钥。
      # 验证方式（写进 README）：
      #   cosign verify docker.io/<用户名>/m365-codex:<标签> \
      #     --certificate-identity-regexp '^https://github.com/.+/M365-Codex/.github/workflows/release.yml@.+' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: 用 cosign 签名镜像
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: 输出已推送的标签
        run: |
          echo "已推送以下镜像标签到 Docker Hub："
          echo "${{ steps.meta.outputs.tags }}"
          echo "镜像摘要：${{ steps.build.outputs.digest }}（已用 cosign 无密钥签名）"
