name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 最小权限：CI 只需要读代码
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  quality:
    name: 类型检查 / Lint / 测试
    runs-on: ubuntu-latest
    steps:
      # Action 一律按 commit SHA 固定，防止 tag 被重新指向
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: 单元与集成测试
        run: npm test

  security:
    name: 依赖漏洞与凭据扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: 依赖漏洞扫描（high 及以上阻断）
        run: npm audit --audit-level=high
      - name: 凭据扫描
        run: |
          set -euo pipefail
          echo "检查是否误提交 .env 或账号文件"
          if git ls-files | grep -Ev '^\.env\.example$' | grep -E '(^|/)(\.env($|\.)|accounts?\.json|tokens?\.json|cookies\.txt)'; then
            echo "::error::检测到疑似凭据文件被提交"
            exit 1
          fi
          echo "检查代码中是否出现硬编码密钥形态"
          if git grep -nIE '(sk-[0-9A-Za-z]{48,}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.)' -- ':!*.md' ':!.github/workflows/*'; then
            echo "::error::检测到疑似硬编码的 API Key 或 JWT"
            exit 1
          fi
          echo "凭据扫描通过"

  docker:
    name: 镜像构建与健康检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: 构建镜像
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: m365-codex:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 启动容器并验证 /healthz 与 /readyz
        run: |
          set -euo pipefail
          MASTER_KEY="$(openssl rand -base64 32)"
          docker run -d --name m365-codex-ci -p 8080:8080 \
            -e M365_CODEX_MASTER_KEY="$MASTER_KEY" \
            -e M365_CODEX_ADMIN_PASSWORD='ci-only-throwaway-password' \
            m365-codex:ci

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then break; fi
            if [ "$i" -eq 30 ]; then
              echo "::error::容器未在 30 秒内就绪"
              docker logs m365-codex-ci
              exit 1
            fi
            sleep 1
          done

          echo "healthz: $(curl -fsS http://127.0.0.1:8080/healthz)"
          echo "readyz:  $(curl -fsS http://127.0.0.1:8080/readyz)"

          echo "验证非 root 运行"
          test "$(docker exec m365-codex-ci id -u)" != "0"

          echo "验证 SIGTERM 优雅退出"
          docker stop --timeout 15 m365-codex-ci
          test "$(docker inspect -f '{{.State.ExitCode}}' m365-codex-ci)" = "0"
      - name: 清理
        if: always()
        run: docker rm -f m365-codex-ci || true

  no-master-key:
    name: 缺少主密钥时必须拒绝启动
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: 构建镜像
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: m365-codex:ci
          cache-from: type=gha
      - name: 未设置 M365_CODEX_MASTER_KEY 时应退出
        run: |
          set -euo pipefail
          if docker run --rm -e M365_CODEX_ADMIN_PASSWORD='ci-only-throwaway-password' m365-codex:ci; then
            echo "::error::缺少主密钥时容器竟然启动成功"
            exit 1
          fi
          echo "符合预期：缺少主密钥时拒绝启动"
